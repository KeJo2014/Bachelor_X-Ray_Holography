name: "ResNet-18 Classification Baseline"
checkpoint_dir: "PATH_TO_YOUR_CHECKPOINT_DIRECTORY/baselines/resnet/${oc.env:SLURM_JOB_ID, ${now:%Y-%m-%d_%H-%M-%S}}"
visualization_type: "multi_class_classification"

model:
  _target_: models.baselines.resnet18_baseline.LitResnetBaseline
  num_classes: 3
  lr: 0.001
  weight_decay: 0.05
  warmup_ratio: 0.1
  pretrained: true
  channels: 1

trainer:
  max_epochs: 500
  monitor_metric: "val/f1_macro"
  monitor_mode: "max"