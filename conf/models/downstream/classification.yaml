name: "Multi-Label Classification"
checkpoint_dir: "C:/Users/kelle/Documents/storage/xray/checkpoints/mae/classification/${oc.env:SLURM_JOB_ID, ${now:%Y-%m-%d_%H-%M-%S}}"
visualization_type: "multi_label_classification"

backbone:
  module_class: "models.lightning_modules.backbones.mae.LitMAE"
  checkpoint_path: "C:/Users/kelle/Documents/storage/xray/checkpoints/mae/backbone-535-val_loss=0.3094.ckpt"

