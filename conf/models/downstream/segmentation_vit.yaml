name: "Segmentation"
checkpoint_dir: "C:\\Users\\kelle\\Documents\\storage\\xray\\checkpoints\\random_mae\\segmentation"
visualization_type: "segmentation"

backbone:
  module_class: "models.lightning_modules.backbones.dinov3.Dinov3Backbone"
  checkpoint_path: "C:\\Users\\kelle\\Documents\\storage\\xray\\checkpoints\\dinov3\\mae-epoch=04-train_loss=0.0000.ckpt"

task:
  _target_: models.lightning_modules.tasks.segmentation_task.LitSegmentationTask
  freeze_encoder: true
  lr: 1e-4
  warmup_ratio: 0.1
  weight_decay: 0.05
  
  head:
    _target_: models.heads.segmentation_head.ViTSegmentationHead
    embed_dim: 768
    num_classes: 1
    img_size: 960
    patch_size: 16

trainer:
  max_epochs: 1
  monitor_metric: "val/loss"
  monitor_mode: "min"