name: "MAE Experiment"
checkpoint_dir: "PATH_TO_YOUR_CHECKPOINT_DIRECTORY/backbones/mae/${oc.env:SLURM_JOB_ID, ${now:%Y-%m-%d_%H-%M-%S}}"
parameters:
  model:
    _target_: models.lightning_modules.backbones.mae.LitMAE
    pretext_strategy:
      _target_: models.lightning_modules.pretext_tasks.random_masking.RandomMaskingStrategy  # or models.lightning_modules.pretext_tasks.random_real_space_masking.RandomMaskingRealSpaceStrategy
      img_size: 224
      patch_size: 16
      mask_ratio: 0.75
    patch_size: 16
    embed_dim: 768
    decoder_embed_dim: 512
    decoder_depth: 8
    decoder_num_heads: 16
    mask_ratio: 0.75
    lr: 1.5e-4
    warmup_ratio: 0.1
    weight_decay: 0.05
    channels: 3
  num_epochs: 800
  log_every_n_epochs: 20
