defaults:
  - models/backbones: mae
  - override hydra/sweeper: optuna
  - override hydra/launcher: submitit_slurm

hydra:
  launcher:
    partition: main
    timeout_min: 1440
    cpus_per_task: 10
    gpus_per_node: 1
    tasks_per_node: 1
    mem_gb: 64
    nodes: 1
    name: ${hydra.job.name}

  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    direction: minimize
    study_name: Backbone Hyperparameter Optimization
    storage: "sqlite:///optuna.db"
    n_trials: 50
    n_jobs: 1
    params:
      models.backbones.parameters.model.lr: interval(1e-5, 5e-4)
      models.backbones.parameters.model.weight_decay: interval(1e-4, 1e-1)
      models.backbones.parameters.model.warmup_ratio: choice(0.05, 0.1, 0.2)


loglevel: INFO
mlflow_uri: "sqlite:///mlflow.db"
mlflow_log_system_metrics: true
hyperparameter_optimization_mode: false
eval_only_mode: false

datamodule: 
  _target_: datasets.simulated_dataset.HologramDataModule
  data_dir: "C:\\Users\\kelle\\Documents\\storage\\xray\\Raw_holo_sim\\simulation_sweep_1.h5"
  mode: "raw"
  # add_poisson_noise: false
  center_holograms: true
  limit_samples: 60

experiments:
  batch_size: 1