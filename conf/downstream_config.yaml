defaults:
  - models/downstream: classification  # or segmentation_dpt
  - _self_

loglevel: INFO
mlflow_uri: "sqlite:///mlflow.db"
mlflow_log_system_metrics: true
batch_size: 512
eval_only_mode: false

datamodule: 
  _target_: datasets.simulated_dataset.HologramDataModule
  data_dir: "PATH_TO_YOUR_DATASET_SHARDS_DIRECTORY"
  mode: "rgb"
  total_samples: 250000
  train_fraction: 1.0